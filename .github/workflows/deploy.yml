name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A red typecheck/lint can never be published either —
      # previously only the CI workflow ran these.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Post-deploy verification: the live site must answer 200 and contain the
  # app shell. A failed verification marks the deployment job red.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify live deployment
        run: |
          URL="https://aresmaeily2.github.io/RYAZI-YAR-SIX/"
          echo "Checking $URL"
          HTTP_CODE=$(curl -sS -o /tmp/page.html -w "%{http_code}" -L "$URL")
          echo "HTTP status: $HTTP_CODE"
          test "$HTTP_CODE" = "200"
          grep -q "ریاضی‌یار" /tmp/page.html
          echo "Deployment verified: app shell is live."
